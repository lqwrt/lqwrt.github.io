html:not(.hw) .hwbg,html:not(.hw) .hwdeco{display:none}
html.hw:not(.rbx) .hwdeco.rb,html.hw.rbx .hwdeco.tg{display:none}
html.hw:root:not(.zz){--bg:#140b1f;--surface:#24152f;--ink:#ffe9d2;--muted:#c7a6d6;--line:#432a57;--accent:#ff7a1a;--accent2:#a066ff;--n1:#ff8a2b}
html.hw body{background:#140b1f}
.hw .bg i{opacity:0}.hw .bg::after{opacity:.05}
.hw .star{color:#ff8a2b;opacity:.12}
.hw .glow{--gl:rgba(255,130,30,.13)}
.hw .nick{--n1:#ff8a2b;--n2:#fff1d6;--ng:rgba(255,120,30,.5)}
.hw .ring{filter:drop-shadow(0 0 16px rgba(255,122,26,.55))}
.hw .link{border-color:#5a3270}
.hw .link:hover{border-color:#ff8a2b;box-shadow:4px 4px 0 #ff8a2b}
.hw .chips span{border-color:#5a3270}
.hw .meteor{background:linear-gradient(to bottom,transparent,#ffb36b)}
.hw .sep svg{color:#ff8a2b}
.hwbg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 84% 13%,rgba(255,196,110,.5) 0,rgba(255,140,40,.16) 11%,transparent 30%),radial-gradient(ellipse at 20% 105%,rgba(130,50,210,.5),transparent 58%),radial-gradient(ellipse at 90% 100%,rgba(255,110,20,.22),transparent 50%),linear-gradient(180deg,#0d0617 0%,#1b0b2c 52%,#2a0e2a 100%)}
.hwbg::before{content:"";position:absolute;top:8%;right:12%;width:clamp(64px,11vw,110px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff4c9 0,#ffd27a 55%,#f0a248 100%);box-shadow:0 0 50px 14px rgba(255,190,90,.45),0 0 140px 50px rgba(255,140,30,.22)}
.hwbg::after{content:"";position:absolute;left:-25%;right:-25%;bottom:0;height:34%;background:radial-gradient(ellipse at 28% 100%,rgba(255,255,255,.11),transparent 60%),radial-gradient(ellipse at 72% 100%,rgba(205,165,255,.13),transparent 60%);animation:fog 20s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.hwdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hwdeco .d{position:absolute;display:block}
.hwdeco.tg .web1{top:0;right:0;width:clamp(110px,22vw,190px);aspect-ratio:1;color:rgba(255,235,210,.5)}
.hwdeco.tg .web2{bottom:0;left:0;width:clamp(90px,16vw,150px);aspect-ratio:1;color:rgba(255,235,210,.3);transform:scale(-1,-1)}
.hang{position:absolute;top:0;right:clamp(70px,16vw,150px);transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite}
.hang i{display:block;width:1.5px;height:clamp(60px,12vh,110px);margin:0 auto;background:rgba(255,235,210,.55)}
.hang .spd{position:static;width:34px;height:31px;color:#150a1f;filter:drop-shadow(0 0 1px rgba(255,235,210,.6))}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.hwdeco.tg .bat{width:clamp(34px,6vw,54px);height:clamp(17px,3vw,27px);color:#0a0410;left:0;animation:fly 19s linear infinite,flap .28s ease-in-out infinite alternate}
.bat.b1{top:16%}.bat.b2{top:32%;animation-duration:25s,.3s;animation-delay:-9s,0s}.bat.b3{top:48%;animation-duration:22s,.26s;animation-delay:-15s,0s}
@keyframes fly{from{translate:-90px 0}to{translate:calc(100vw + 90px) 0}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
.hwdeco.tg .pk{bottom:6px;color:#ffe27a;animation:flick 3s ease-in-out infinite}
.pk.p1{left:6%;width:clamp(40px,7vw,62px);height:clamp(36px,6.2vw,55px)}.pk.p2{left:calc(6% + clamp(34px,6vw,54px));width:clamp(28px,5vw,42px);height:clamp(25px,4.4vw,37px);animation-delay:-1s}.pk.p3{right:7%;width:clamp(44px,7.5vw,68px);height:clamp(39px,6.6vw,60px);animation-delay:-2s}
.hwdeco.rb .gh{color:rgba(255,255,255,.8);filter:drop-shadow(0 0 10px rgba(190,170,255,.7));animation:bob 5s ease-in-out infinite,sway 9s ease-in-out infinite}
.gh.g1{left:7%;top:20%;width:clamp(34px,6vw,54px);height:clamp(42px,7.5vw,68px)}.gh.g2{right:9%;top:42%;width:clamp(28px,5vw,44px);height:clamp(35px,6.2vw,55px);animation-delay:-2s,-3s}.gh.g3{left:44%;top:8%;width:clamp(22px,4vw,34px);height:clamp(28px,5vw,42px);opacity:.6;animation-delay:-4s,-6s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -16px}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.hwdeco.rb .tb{bottom:-4px;color:#2c1a3d;height:clamp(40px,8vw,70px);width:clamp(32px,6.4vw,56px)}
.tb.t1{left:2%}.tb.t2{left:14%;height:clamp(32px,6vw,52px)}.tb.t3{left:46%;height:clamp(34px,6.5vw,56px)}.tb.t4{right:20%}.tb.t5{right:3%;height:clamp(46px,9vw,80px)}
.hwdeco.rb .cat{bottom:-2px;right:calc(9% + clamp(30px,6vw,52px));width:clamp(34px,6vw,54px);height:clamp(40px,7.2vw,65px);color:#07030c}
.hwdeco.rb .cd{bottom:2px;width:clamp(14px,2.6vw,22px);height:clamp(32px,6vw,52px)}
.cd.c1{left:calc(2% + clamp(36px,6.6vw,60px))}.cd.c2{left:calc(14% + clamp(36px,6.6vw,60px));animation:flk .9s ease-in-out infinite alternate}
.hwdeco.rb .cd{filter:drop-shadow(0 0 8px rgba(255,170,40,.7));animation:flk 1.1s ease-in-out infinite alternate}
@keyframes flk{from{opacity:.85}to{opacity:1;filter:drop-shadow(0 0 14px rgba(255,190,60,.95))}}
.hwdeco.rb .orb{position:absolute;bottom:-12px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#c8ffb0,#5fe06a 60%,transparent 72%);box-shadow:0 0 12px #6bff7a;animation:rise 11s linear infinite;opacity:0}
.orb.o1{left:20%}.orb.o2{left:38%;animation-delay:-3s}.orb.o3{left:56%;animation-delay:-6s;background:radial-gradient(circle,#e6c8ff,#a066ff 60%,transparent 72%);box-shadow:0 0 12px #a066ff}.orb.o4{left:72%;animation-delay:-8s}.orb.o5{left:88%;animation-delay:-1s;background:radial-gradient(circle,#e6c8ff,#a066ff 60%,transparent 72%);box-shadow:0 0 12px #a066ff}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}100%{opacity:0;transform:translate(24px,-85vh)}}
/* прежняя аватарка Roblox сохранена: чтобы вернуть, уберите класс old у первой картинки */
.avatar.old{display:none!important}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
