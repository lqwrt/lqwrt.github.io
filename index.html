<style>
:root{--bg:#f0f0f2;--surface:#ffffff;--ink:#1c1c20;--muted:#6b6b73;--accent:#3a3a40;--accent2:#8b8b94;--line:#dcdce0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#121214;--surface:#1d1d21;--ink:#f0f0f2;--muted:#9b9ba4;--accent:#c8c8cf;--accent2:#8f8f98;--line:#303036}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:40px 18px}
main{width:100%;max-width:440px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}
img.avatar{object-fit:cover;background:#fff}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.bio{color:var(--muted);margin:8px auto 28px;font-size:clamp(13px,4.2vw,17px);line-height:1.5;white-space:nowrap}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);font:inherit;font-weight:600;font-size:16px;text-align:left;cursor:pointer;width:100%;transition:transform .15s,border-color .15s}
.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.link{text-decoration:none}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none;background:var(--accent)}
.link:nth-child(2) .ico{background:#27a869}.link:nth-child(3) .ico{background:var(--accent2)}.link:nth-child(4) .ico{background:#27a869}
.link span.t{flex:1}
.link small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.note{margin:24px auto 0;max-width:36ch;font-size:14.5px;line-height:1.55;color:var(--muted)}
body{background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px;position:relative;overflow-x:hidden}
main{position:relative;z-index:1}
.star{position:fixed;color:var(--ink);opacity:.1;pointer-events:none;z-index:0}
.s1{width:150px;top:3%;left:-44px;animation:tw 7s ease-in-out infinite alternate}.s2{width:100px;top:14%;right:-26px}.s3{width:80px;bottom:20%;left:5%}.s4{width:180px;bottom:-40px;right:-30px;animation:tw 9s ease-in-out infinite alternate-reverse}
@keyframes tw{from{transform:rotate(0) scale(1)}to{transform:rotate(25deg) scale(1.12)}}
.avatar{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--ink)}
.sep{display:flex;align-items:center;gap:12px;margin:0 auto 24px;max-width:300px;color:var(--ink)}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.sep svg{width:16px;height:16px}
.link::after{content:"›";font-size:24px;line-height:1;color:var(--muted)}
.link:hover{transform:translate(-2px,-2px);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.star{animation:none!important}}
.rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;contain:strict}
.rain img{position:absolute;top:-60px;animation:fall linear infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(0,calc(100vh + 120px),0) rotate(360deg)}}
.nick{--n1:#55555d;--n2:#d0d0d6;background:linear-gradient(100deg,var(--n1) 0%,var(--n1) 44%,var(--n2) 50%,var(--n1) 56%,var(--n1) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nshine 4.5s linear infinite}
@media (prefers-color-scheme:dark){.nick{--n1:#8e8e98;--n2:#ffffff}}
@keyframes nshine{from{background-position:120% 0}to{background-position:-20% 0}}
@keyframes shine{to{background-position:200% 0}}
.spark{display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25) rotate(15deg)}}
.chips{display:flex;justify-content:center;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.chips span{padding:5px 12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:13px;font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.link{animation:up .6s backwards}.link:nth-child(2){animation-delay:.08s}.link:nth-child(3){animation-delay:.16s}

.link:active{transform:translate(1px,1px);box-shadow:none}

function grab(e){var s=e.target;if(s.tagName!=='IMG'||(e.pointerType==='mouse'&&e.button))return;e.preventDefault();
